name: Overly Deals Updater

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: deals-scraper
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OVERLY_SITE_URL: https://overly.live/
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Verify Python syntax and core safety rules
        run: |
          PYTHONPYCACHEPREFIX=/tmp/overly-pycache python -m py_compile scraper.py generate_seo.py verify_seo.py verify_affiliate_links.py build_public_site.py
          python -m unittest discover -v

      - name: Run scraper
        run: python scraper.py
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_USERNAME: ${{ secrets.TELEGRAM_CHANNEL_USERNAME }}
          # المنتجات الجديدة فور اكتشافها، ومنتج مميز واحد كل ساعتين بحد 10 يومياً.
          TELEGRAM_MAX_NEW_POSTS: "30"
          TELEGRAM_FEATURED_INTERVAL_HOURS: "2"
          TELEGRAM_FEATURED_DAILY_LIMIT: "10"
          # Amazon Creators API (البديل الرسمي لـ PA-API) — يكفي إضافة هذين السرّين لتفعيل التحديث الحيّ.
          # باقي الإعدادات لها قيم افتراضية جاهزة للسعودية داخل الكود.
          CREATORS_CLIENT_ID: ${{ secrets.CREATORS_CLIENT_ID }}
          CREATORS_CLIENT_SECRET: ${{ secrets.CREATORS_CLIENT_SECRET }}
          # AliExpress Affiliates API — المفاتيح تبقى داخل GitHub Secrets فقط.
          ALIEXPRESS_APP_KEY: ${{ secrets.ALIEXPRESS_APP_KEY }}
          ALIEXPRESS_APP_SECRET: ${{ secrets.ALIEXPRESS_APP_SECRET }}
          ALIEXPRESS_TRACKING_ID: ${{ secrets.ALIEXPRESS_TRACKING_ID }}

      - name: Generate SEO pages and sitemap
        run: python generate_seo.py
        env:
          SEO_MAX_PRODUCT_PAGES: "1000"

      - name: Verify SEO output
        run: python verify_seo.py

      - name: Verify every published affiliate link
        run: python verify_affiliate_links.py

      - name: Build safe Cloudflare site bundle
        run: python build_public_site.py

      - name: Commit & push (if changed)
        run: |
          git config user.name "deals-bot"
          git config user.email "actions@github.com"
          git add deals.json
          git add -A -- sitemap.xml deals-initial.json seo.css seo-state.json seo-generated-files.json seo-report.json
          git add -A -- products categories stores guides about.html methodology.html 404.html
          if [ -f posted_deals.json ]; then git add posted_deals.json; fi
          if [ -f asins.json ]; then git add asins.json; fi
          if [ -f aliexpress_products.json ]; then git add aliexpress_products.json; fi
          if git diff --cached --quiet; then
            echo "No changes - skipping commit."
          else
            git commit -m "تحديث العروض تلقائياً"
            git push
          fi

      - name: Deploy overly.live to Cloudflare
        if: ${{ env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ env.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.site.jsonc

      - name: Explain skipped Cloudflare deploy
        if: ${{ env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == '' }}
        run: echo "Cloudflare deploy skipped — add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository secrets."
